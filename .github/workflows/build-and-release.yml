name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    outputs:
      tag-name: ${{ steps.get-tag.outputs.TAG_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Build .deb package
        run: npm run dist:deb -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts
        run: |
          ls -la dist/
          echo "DEB files:"
          find dist -name "*.deb" -type f

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-electron-deb
          path: dist/*.deb
          retention-days: 30

      - name: Get tag name
        id: get-tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

  build-rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build .rpm package
        run: npm run dist:rpm -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-electron-rpm
          path: dist/*.rpm
          retention-days: 30

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-electron-windows
          path: dist/*.exe
          retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-electron-macos
          path: dist/*.dmg
          retention-days: 30

  create-release:
    needs: [build-deb, build-rpm, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: chess-electron-deb
          path: release-files

      - name: Download .rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: chess-electron-rpm
          path: release-files

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: chess-electron-windows
          path: release-files

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: chess-electron-macos
          path: release-files

      - name: List release files
        run: ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
